services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://sivaplana.cloud}
    volumes:
      - backend_data:/app/data
      - backend_media:/app/media
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_BASE: /fight-rank/
        VITE_API_BASE: /fight-rank
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  backend_data:
  backend_media:
