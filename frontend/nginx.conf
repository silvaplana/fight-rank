# Serves the FightRank SPA under /fight-rank/ and proxies its API + media
# calls to the backend container. Meant to sit behind the VPS's own
# reverse proxy (which just forwards /fight-rank/* here untouched).

server {
    listen 80;
    client_max_body_size 220m; # a bit above the backend's 200MB video cap

    location /fight-rank/ {
        alias /usr/share/nginx/html/fight-rank/;
        try_files $uri $uri/ /fight-rank/index.html;
    }

    location /fight-rank/api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /fight-rank/media/ {
        proxy_pass http://backend:8000/media/;
    }
}
